# Docker Compose для Telegram AutoPoster Bot
version: '3.8'

services:
  autoposter-bot:
    build: .
    container_name: telegram-autoposter
    restart: unless-stopped
    
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - API_PORT=${API_PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-UTC}
    
    ports:
      - "${API_PORT:-8080}:8080"
    
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./media:/app/media
      - ./.env:/app/.env:ro
    
    networks:
      - autoposter-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Опционально: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: autoposter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - autoposter-bot
    networks:
      - autoposter-network
    profiles:
      - production

  # Опционально: Мониторинг с помощью Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: autoposter-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - monitoring

  # Опционально: Grafana для визуализации метрик
  grafana:
    image: grafana/grafana:latest
    container_name: autoposter-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  autoposter-network:
    driver: bridge

volumes:
  grafana-data: